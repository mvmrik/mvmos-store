<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#1e1e2e">
  <title>Image Optimizer</title>
  <style>html,body{margin:0;height:100%;background:var(--pub-bg,#1e1e2e)}#image-optimizer-root{height:100dvh}</style>
</head>
<body>
<div id="image-optimizer-root"></div>
<script src="/i18n/i18n.js"></script>
<script>
(function () {
  var token = localStorage.getItem('apphub_token');
  if (!token) {
    location.replace('/pub/apphub/?return=' + encodeURIComponent(location.href));
    return;
  }
  function load(src) {
    return new Promise(function (resolve, reject) {
      var script = document.createElement('script');
      script.src = src + '?v=' + Date.now();
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }
  (window.mvmOS && window.mvmOS.i18nReady || Promise.resolve())
    .then(function () { return load('/apps/image-optimizer/i18n.js'); })
    .then(function () { return load('/apps/image-optimizer/image-optimizer.js'); })
    .then(function () {
      document.title = (window.t && window.t('io_title')) || 'Image Optimizer';
      window.ImageOptimizer.mount(document.getElementById('image-optimizer-root'), {
        onNeedLogin: function () {
          location.replace('/pub/apphub/?return=' + encodeURIComponent(location.href));
        }
      });
    });
})();
</script>
</body>
</html>
