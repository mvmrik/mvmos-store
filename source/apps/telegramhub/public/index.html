<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Telegram Hub — mvmOS</title>
<style>
  html,body{margin:0;padding:0;min-height:100%;background:var(--pub-bg,#1e1e2e);color:var(--pub-fg,#cdd6f4);
    font-family:system-ui,sans-serif}
  #app{max-width:560px;margin:0 auto;padding:20px 16px 40px;box-sizing:border-box}
</style>
</head>
<body>
<div id="app"></div>
<script src="/i18n/i18n.js"></script>
<script>
(function () {
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = (window.asset ? window.asset(src) : src);
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  (window.mvmOS && window.mvmOS.i18nReady || Promise.resolve()).then(function () {
    return loadScript('/apps/telegramhub/i18n.js');
  }).then(function () {
    return loadScript('/apps/telegramhub/page.js');
  });
})();
</script>
</body>
</html>
