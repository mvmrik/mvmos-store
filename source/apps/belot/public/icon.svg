      <rect x="-24" y="-35" width="48" height="70" rx="8" fill="url(#paper)"/>
      <text x="-18" y="-17" font-family="Georgia,'Times New Roman',serif" font-size="18" font-weight="700" fill="#c4262e">9</text>
      <use href="#heart" fill="#c4262e" transform="translate(-11 -3) scale(.8)"/>
