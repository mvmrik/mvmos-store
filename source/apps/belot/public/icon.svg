      <stop offset="0" stop-color="#2f9a62"/>
      <stop offset="1" stop-color="#0f5a38"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece9df"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#04200f" flood-opacity=".55"/>
