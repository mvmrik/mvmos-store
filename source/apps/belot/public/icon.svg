      <text x="18" y="-17" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="18" font-weight="700" fill="#c4262e">A</text>
      <use href="#dia" fill="#c4262e" transform="translate(11 -3) scale(.7)"/>
      <use href="#dia" fill="#c4262e" transform="translate(4 14) scale(1.35)"/>
    </g>
