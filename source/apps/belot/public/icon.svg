  <rect width="128" height="128" rx="28" fill="url(#felt)"/>
  <rect x="5" y="5" width="118" height="118" rx="24" fill="none" stroke="#f0c85a" stroke-width="2.4" opacity=".75"/>
  <g filter="url(#sh)">
