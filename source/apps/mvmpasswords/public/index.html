<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>mvmPasswords</title><style>html,body{margin:0;height:100%;background:var(--pub-bg,#1e1e2e)}#pm-root{height:100dvh}</style></head><body><div id="pm-root"></div><script src="/i18n/i18n.js"></script><script>(function(){var token=localStorage.getItem('apphub_token');if(!token){location.replace('/pub/apphub/?return='+encodeURIComponent(location.href));return}// A per-load cache buster re-downloaded ~66KB of scripts every time the popup
// opened, which is most of the visible wait. api.py substitutes the app's own
// version here, so the browser reuses its cached copy until the next release
// and there is no second version number to keep in step by hand.
function load(s){return new Promise(function(ok,bad){var x=document.createElement('script');x.src=s+'?v=__APP_VERSION__';x.onload=ok;x.onerror=bad;document.head.appendChild(x)})}(window.mvmOS&&window.mvmOS.i18nReady?window.mvmOS.i18nReady:Promise.resolve()).then(function(){return Promise.all([load('/apps/mvmpasswords/i18n.js'),load('/apps/mvmpasswords/passkey-webauthn.js'),load('/apps/mvmpasswords/password-manager-widget.js')])}).then(function(){MvmPasswordManagerWidget.mount(document.getElementById('pm-root'),{onNeedLogin:function(){location.replace('/pub/apphub/?return='+encodeURIComponent(location.href))}})})})();</script></body></html>
