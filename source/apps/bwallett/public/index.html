<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>BwalletT</title>
  <style>html,body{margin:0;height:100%;background:var(--pub-bg,#07111f)}#bw-root{height:100dvh}</style>
</head>
<body>
  <div id="bw-root"></div>
  <script src="/i18n/i18n.js"></script>
  <script>
  (function(){
    var token=localStorage.getItem('apphub_token');
    if(!token){location.replace('/pub/apphub/?return='+encodeURIComponent(location.href));return}
    function load(src){return new Promise(function(ok,bad){var s=document.createElement('script');s.src=src+'?v=__APP_VERSION__';s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
    (window.mvmOS&&window.mvmOS.i18nReady?window.mvmOS.i18nReady:Promise.resolve())
      .then(function(){return load('/apps/bwallett/i18n.js')})
      .then(function(){return load('/apps/bwallett/bwallett-crypto.js')})
      .then(function(){return load('/apps/bwallett/bwallett-widget.js')})
      .then(function(){BwalletTWidget.mount(document.getElementById('bw-root'),{onNeedLogin:function(){location.replace('/pub/apphub/?return='+encodeURIComponent(location.href))}})});
  })();
  </script>
</body>
</html>
