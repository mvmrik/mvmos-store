<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>mvmOS Chat</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#1e1e2e;overflow:hidden}
  #chat-root{height:100dvh}
</style>
</head>
<body>
<div id="chat-root"></div>
<script>
(function () {
  var token = localStorage.getItem('apphub_token');
  if (!token) {
    location.replace('/pub/apphub/?return=' + encodeURIComponent(location.href));
    return;
  }
  var s = document.createElement('script');
  s.src = '/apps/chat/chat-widget.js?_=' + Date.now();
  s.onload = function () {
    ChatWidget.mount(document.getElementById('chat-root'), {
      onNeedLogin: function () {
        location.replace('/pub/apphub/?return=' + encodeURIComponent(location.href));
      }
    });
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
