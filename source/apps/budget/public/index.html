<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Budget</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:var(--pub-bg,#1e1e2e);overflow:hidden}
  #budget-root{height:100dvh}
</style>
</head>
<body>
<div id="budget-root"></div>
<script src="/i18n/i18n.js"></script>
<script>
(function () {
  var token = localStorage.getItem('apphub_token');
  if (!token) {
    location.replace('/pub/apphub/?return=' + encodeURIComponent(location.href));
    return;
  }
  // i18n.js first: the widget reads window.BUDGET_I18N as it defines itself.
  function load(src, next) {
    var s = document.createElement('script');
    s.src = src + '?_=' + Date.now();
    s.onload = next;
    document.head.appendChild(s);
  }
  (window.mvmOS && window.mvmOS.i18nReady || Promise.resolve()).then(function () {
    load('/apps/budget/i18n.js', function () {
      load('/apps/budget/budget-widget.js', function () {
        BudgetWidget.mount(document.getElementById('budget-root'), {
          onNeedLogin: function () {
            location.replace('/pub/apphub/?return=' + encodeURIComponent(location.href));
          }
        });
      });
    });
  });
})();
</script>
</body>
</html>
