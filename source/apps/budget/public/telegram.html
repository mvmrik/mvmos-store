<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Budget</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:var(--pub-bg,#1e1e2e);overflow:hidden}
  #budget-root{height:100dvh}
  .bw-login{display:flex;align-items:center;justify-content:center;height:100%;color:#a6adc8;
    font-family:system-ui,sans-serif;font-size:.9rem;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="budget-root"></div>
<!-- The same core language loader the public page uses. Without it the
     mini-app has no window.mvmOS.lang and every string falls back to English,
     however the account's own language is set. -->
<script src="/i18n/i18n.js"></script>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var root = document.getElementById('budget-root');
  function fail(msg) {
    root.innerHTML = '<div class="bw-login">' + msg + '</div>';
  }

  var initData = tg && tg.initData;
  if (!initData) {
    fail('Open this from the mvmOS Telegram bot.');
    return;
  }

  fetch('/api/pub/telegramhub/miniapp/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ init_data: initData }),
  }).then(function (r) {
    if (!r.ok) throw new Error('auth_failed');
    return r.json();
  }).then(function (data) {
    function load(src, next) {
      var s = document.createElement('script');
      s.src = src + '?_=' + Date.now();
      s.onload = next;
      document.head.appendChild(s);
    }
    localStorage.setItem('apphub_token', data.pub_token);
    var params = new URLSearchParams(location.search);
    var categoryId = params.get('category');
    // The app's own i18n.js first: the widget reads window.BUDGET_I18N as it
    // defines itself, and it reads the chosen language only once that has been
    // settled, so the widget waits for both.
    (window.mvmOS && window.mvmOS.i18nReady || Promise.resolve()).then(function () {
      load('/apps/budget/i18n.js', function () {
        load('/apps/budget/budget-widget.js', function () {
          BudgetWidget.mount(root, { openCategory: categoryId || undefined });
        });
      });
    });
  }).catch(function () {
    fail('Could not verify your Telegram account. Link it again from the bot with /start.');
  });
})();
</script>
</body>
</html>
