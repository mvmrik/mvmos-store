<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Tree</title><style>html,body{margin:0;height:100%;background:var(--pub-bg,#102b2b)}#familytree{height:100dvh}</style></head><body><div id="familytree"></div><script>
(async()=>{
  if(!localStorage.getItem('apphub_token')){location.replace('/pub/apphub/?return='+encodeURIComponent(location.href));return}
  const load=src=>new Promise((ok,bad)=>{const s=document.createElement('script');s.src=window.asset(src);s.onload=ok;s.onerror=bad;document.head.appendChild(s)});
  await load('/i18n/i18n.js');await load('/apps/familytree/i18n.js');await load('/apps/familytree/dates.js');await load('/apps/familytree/kinship.js');await load('/apps/familytree/widget.js');
  window.FamilyTree.mount(document.getElementById('familytree'));
})();
</script></body></html>
