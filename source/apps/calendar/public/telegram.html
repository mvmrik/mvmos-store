<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Calendar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:var(--pub-bg,#1e1e2e);overflow:hidden}
  #calendar-root{height:100dvh}
  .cw-login{display:flex;align-items:center;justify-content:center;height:100%;color:#a6adc8;
    font-family:system-ui,sans-serif;font-size:.9rem;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="calendar-root"></div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var root = document.getElementById('calendar-root');
  function fail(msg) {
    root.innerHTML = '<div class="cw-login">' + msg + '</div>';
  }

  var initData = tg && tg.initData;
  if (!initData) {
    fail('Open this from the mvmOS Telegram bot.');
    return;
  }

  fetch('/api/pub/telegramhub/miniapp/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ init_data: initData }),
  }).then(function (r) {
    if (!r.ok) throw new Error('auth_failed');
    return r.json();
  }).then(function (data) {
    localStorage.setItem('apphub_token', data.pub_token);
    var params = new URLSearchParams(location.search);
    var eventId = params.get('event');
    var s = document.createElement('script');
    s.src = '/apps/calendar/calendar-widget.js?_=' + Date.now();
    s.onload = function () {
      CalendarWidget.mount(root, { openEvent: eventId || undefined });
    };
    document.head.appendChild(s);
  }).catch(function () {
    fail('Could not verify your Telegram account. Link it again from the bot with /start.');
  });
})();
</script>
</body>
</html>
