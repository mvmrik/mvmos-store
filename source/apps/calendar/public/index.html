<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Calendar</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:var(--pub-bg,#1e1e2e);overflow:hidden}
  #calendar-root{height:100dvh}
</style>
</head>
<body>
<div id="calendar-root"></div>
<script src="/i18n/i18n.js"></script>
<script>
(function () {
  var token = localStorage.getItem('apphub_token');
  if (!token) {
    location.replace('/pub/apphub/?return=' + encodeURIComponent(location.href));
    return;
  }
  (window.mvmOS && window.mvmOS.i18nReady || Promise.resolve()).then(function () {
    var s = document.createElement('script');
    s.src = '/apps/calendar/calendar-widget.js?_=' + Date.now();
    s.onload = function () {
      CalendarWidget.mount(document.getElementById('calendar-root'), {
        onNeedLogin: function () {
          location.replace('/pub/apphub/?return=' + encodeURIComponent(location.href));
        }
      });
    };
    document.head.appendChild(s);
  });
})();
</script>
</body>
</html>
