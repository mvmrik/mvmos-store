<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>mvmOffice</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:var(--pub-bg,#1e1e2e);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  #mvmoffice-root{height:100dvh}
</style>
</head>
<body>
<div id="mvmoffice-root"></div>
<script src="/i18n/i18n.js"></script>
<script>
(function () {
  var token = localStorage.getItem('apphub_token');
  function toLogin() {
    location.replace('/pub/apphub/?return=' + encodeURIComponent(location.href));
  }
  if (!token) { toLogin(); return; }
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src + '?_=' + Date.now();
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  var files = ['lib/prosemirror.min.js', 'i18n.js', 'formula.js', 'model.js', 'grid.js', 'editor.js', 'xlsx.js', 'docx.js', 'office.js'];
  function boot() {
    files.reduce(function (p, f) {
      return p.then(function () { return loadScript('/apps/mvmoffice/' + f); });
    }, Promise.resolve()).then(function () {
      MvmOffice.mount(document.getElementById('mvmoffice-root'), { onNeedLogin: toLogin });
    });
  }
  (window.mvmOS && window.mvmOS.i18nReady ? window.mvmOS.i18nReady : Promise.resolve()).then(boot);
})();
</script>
</body>
</html>
