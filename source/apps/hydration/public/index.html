<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hydration</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:var(--pub-bg,#1e1e2e);overflow:hidden}
  #hydration-root{height:100dvh}
</style>
</head>
<body>
<div id="hydration-root"></div>
<script src="/i18n/i18n.js"></script>
<script>
(function () {
  var token = localStorage.getItem('apphub_token');
  if (!token) {
    location.replace('/pub/apphub/?return=' + encodeURIComponent(location.href));
    return;
  }
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = window.asset ? window.asset(src) : src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  function boot() {
    Promise.all([loadScript('/apps/hydration/i18n.js'), loadScript('/apps/hydration/hydration-widget.js')]).then(function () {
      HydrationWidget.mount(document.getElementById('hydration-root'), {
        onNeedLogin: function () {
          location.replace('/pub/apphub/?return=' + encodeURIComponent(location.href));
        }
      });
    });
  }
  (window.mvmOS && window.mvmOS.i18nReady ? window.mvmOS.i18nReady : Promise.resolve()).then(boot);
})();
</script>
</body>
</html>
