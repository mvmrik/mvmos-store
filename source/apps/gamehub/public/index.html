<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Hub</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#1e1e2e;--surface1:#181825;--surface2:#313244;--border:#45475a;--fg:#cdd6f4;--fg2:#a6adc8;--accent:#89b4fa;--green:#a6e3a1;--red:#f38ba8;--yellow:#f9e2af}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100dvh;display:flex;flex-direction:column}
  #app{flex:1;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  .card{background:var(--surface1);border:1px solid var(--border);border-radius:12px}
  .btn{border:none;border-radius:8px;padding:9px 20px;font-size:.9rem;font-weight:600}
  .btn-primary{background:var(--accent);color:#1e1e2e}
  .btn-primary:hover{opacity:.9}
  .btn-secondary{background:var(--surface2);color:var(--fg);border:1px solid var(--border)}
  .btn-secondary:hover{background:var(--border)}
  .inp{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--fg);font-size:.9rem;width:100%;outline:none}
  .inp:focus{border-color:var(--accent)}
  .err{color:var(--red);font-size:.82rem;min-height:18px}
  .tab-bar{display:flex;gap:6px;border-bottom:1px solid var(--border);padding:0 16px;overflow-y:hidden}
  .tab{background:none;border:none;padding:10px 14px;font-size:.88rem;color:var(--fg2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
  .tab.active{color:var(--accent);border-color:var(--accent)}
  .tab:hover:not(.active){color:var(--fg)}
  .section{padding:16px}
  .stat-box{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-shrink:0}
  .stat-cell{flex:1;text-align:center;padding:12px 8px;border-right:1px solid var(--border)}
  .stat-cell:last-child{border-right:none}
  .stat-val{font-size:20px;font-weight:700}
  .stat-lbl{font-size:11px;color:var(--fg2);margin-top:2px}
  .row{background:var(--surface1);border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .12s}
  .row:hover{background:var(--surface2)}
  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#1e1e2e;flex-shrink:0}
  .badge-win{font-size:11px;color:var(--green)}
  select.inp{cursor:pointer}
  .lb-table{width:100%;border-collapse:collapse;font-size:.85rem}
  .lb-table th{text-align:left;color:var(--fg2);font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;border-bottom:1px solid var(--border)}
  .lb-table td{padding:8px 10px;border-bottom:1px solid rgba(69,71,90,.4)}
  .lb-table tr.me td{background:rgba(137,180,250,.08)}
  .lb-table tr.me td:first-child{border-left:2px solid var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<script src="/i18n/i18n.js"></script>
<script>
window._ghI18nReady = new Promise(function(resolve){
  var s=document.createElement('script');
  s.src=window.asset('/apps/gamehub/i18n.js');
  s.onload = resolve;
  s.onerror = resolve;
  document.head.appendChild(s);
});
(function(){
  var s2=document.createElement('script');
  s2.src=window.asset('/apps/gamehub/avatar.js');
  document.head.appendChild(s2);
  var s3=document.createElement('script');
  s3.src=window.asset('/apps/gamehub/stats-ui.js');
  var s4=document.createElement('script');
  s4.src=window.asset('/apps/gamehub/library.js');
  window._ghStatsReady = Promise.all([
    new Promise(function(res){ s3.onload = res; s3.onerror = res; }),
    new Promise(function(res){ s4.onload = res; s4.onerror = res; })
  ]);
  document.head.appendChild(s3);
  document.head.appendChild(s4);
})();
</script>
<script>
const BASE = '/api/pub/gamehub';
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

// A game's icon as HTML: its own picture where its manifest declares one,
// otherwise its emoji. `o` carries icon and icon_image / iconImage.
function iconHTML(o, fb) {
  const img = o && (o.iconImage || o.icon_image);
  if (img && /^\/apps\/[A-Za-z0-9_-]+\//.test(img)) {
    return '<img src="' + esc(img) + '" alt="" draggable="false" style="width:1em;height:1em;object-fit:contain;vertical-align:-.15em">';
  }
  return esc((o && o.icon) || fb || '🎮');
}
const fmtDate = s => new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const fmtDur = s => !s ? '—' : s < 60 ? s + 's' : Math.floor(s/60) + 'm' + (s%60 ? s%60+'s' : '');

let _cfg = {allow_registrations:true};
let _me = null;
let _token = localStorage.getItem('apphub_token') || localStorage.getItem('gh_token');
let _stats = null;
let _invites = [];
let _pollTimer = null;

const app = document.getElementById('app');

async function boot() {
  app.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--fg2);font-size:.9rem">${esc(t('gh_loading'))}</div>`;
  try {
    const r = await fetch(BASE + '/config');
    _cfg = r.ok ? await r.json() : {allow_registrations:true};
  } catch(_) {}

  // Apps Hub is the source of truth. A stale local 'gh_token' (e.g. left over
  // from a previous account) must never block a fresh apphub_token login.
  const apphubToken = localStorage.getItem('apphub_token');
  const ghToken      = localStorage.getItem('gh_token');
  for (const token of [apphubToken, ghToken]) {
    if (!token) continue;
    try {
      const r = await fetch(BASE + '/me', {headers:{'X-GH-Token':token}});
      if (r.ok) { _me = await r.json(); _token = token; localStorage.setItem('gh_token', token); break; }
    } catch(_) {}
  }
  if (!_me) { _token = null; localStorage.removeItem('gh_token'); }

  if (!_me) { showAuth(); return; }
  await Promise.all([loadStats(), loadInvites(), _loadFavs(), window._ghStatsReady]);
  showDashboard();
}

// ── Auth ────────────────────────────────────────────────────────
// Game Hub has no login of its own — identity comes from Apps Hub.
// Send the user to the central Apps Hub login page and return them here after.
function showAuth() {
  app.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--fg2);font-size:.9rem">${esc(t('gh_redirecting'))}</div>`;
  const here = location.pathname + location.search;
  location.replace('/pub/apphub/?return=' + encodeURIComponent(here));
}

// ── Stats ───────────────────────────────────────────────────────

async function loadStats() {
  try {
    const r = await fetch(BASE + '/stats');
    _stats = r.ok ? await r.json() : null;
  } catch(_) { _stats = null; }
}

async function loadInvites() {
  if (!_token) { _invites = []; return; }
  try {
    const r = await fetch(BASE + '/invites', {headers:{'X-GH-Token':_token}});
    _invites = r.ok ? await r.json() : [];
  } catch(_) { _invites = []; }
}

// ── Dashboard ───────────────────────────────────────────────────

function showDashboard() {
  let dtab = 'games';
  const inviteBadge = () => _invites.length ? ` <span style="background:var(--red);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;vertical-align:middle">${_invites.length}</span>` : '';
  app.innerHTML = `
    <div class="tab-bar" style="overflow-x:auto;overflow-y:hidden;flex-shrink:0">
      <button class="tab active" data-t="games">${esc(t('gl_tab_games'))}${inviteBadge()}</button>
      <button class="tab" data-t="store">${esc(t('gl_tab_store'))}</button>
      <button class="tab" data-t="ranking">${esc(t('gs_ranking'))}</button>
      <button class="tab" data-t="favourites">${esc(t('gh_favourites'))}</button>
      <button class="tab" data-t="profile">${esc(t('gl_tab_profile'))}</button>
    </div>
    <div id="d-body" style="flex:1;overflow-y:auto"></div>`;

  window.MvmLayout && MvmLayout.refresh();

  // Poll for new invites every 15s
  clearInterval(_pollTimer);
  _pollTimer = setInterval(async () => {
    if (!_token) return;
    const gamesTab = app.querySelector('.tab[data-t="games"]');
    if (!gamesTab) { clearInterval(_pollTimer); _pollTimer = null; return; }
    await loadInvites();
    gamesTab.innerHTML = `${esc(t('gl_tab_games'))}${inviteBadge()}`;
    const activeTab = app.querySelector('.tab.active');
    if (activeTab?.dataset.t === 'games' && !app.querySelector('#d-body [data-view="detail"]')) renderGames(app.querySelector('#d-body'));
  }, 15000);

  app.querySelectorAll('.tab').forEach(btn => {
    btn.onclick = () => {
      dtab = btn.dataset.t;
      app.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      renderDashTab(dtab);
    };
  });

  renderDashTab('games');
}

function renderDashTab(tab) {
  const c = app.querySelector('#d-body');
  if (tab === 'games')           { c.innerHTML = '<div class="section"></div>'; renderGames(c.firstElementChild); }
  else if (tab === 'store')      renderStoreTab(c);
  else if (tab === 'profile')    renderProfile(c);
  else if (tab === 'ranking')    renderRanking(c);
  else if (tab === 'favourites') renderFavourites(c);
}

// ── Store tab ───────────────────────────────────────────────────

async function renderStoreTab(c) {
  c.innerHTML = `<div class="section" style="max-width:720px"></div>`;
  const box = c.firstElementChild;
  box.innerHTML = `<div style="color:var(--fg2);text-align:center;padding:24px">${esc(t('gs_loading'))}</div>`;
  await GHLibrary.load(_token, true);
  GHLibrary.renderStore(box, { token: _token });
}

// ── Ranking tab ─────────────────────────────────────────────────

function renderRanking(c) {
  c.innerHTML = `<div class="section" style="max-width:720px"></div>`;
  GHStats.renderOverall(c.firstElementChild, {
    myId: _me.id, token: _token,
    onPlayer: p => showOtherPlayerProfile((_stats?.players || []).find(pl => pl.id === p.id) || p),
  });
}

// ── Profile tab ─────────────────────────────────────────────────
// Every number comes from the server's own count of the whole history. Wins and
// win rate are multiplayer figures: a solo run has nobody to beat, and mixing
// the two used to make the percentage meaningless.

const _fmtTime = s => !s ? '—' : s >= 3600 ? Math.floor(s/3600) + 'h ' + String(Math.floor(s%3600/60)).padStart(2,'0') + 'm' : Math.max(1, Math.round(s/60)) + 'm';

async function renderProfile(c) {
  const myId = _me.id;
  c.innerHTML = `<div class="section" style="color:var(--fg2);text-align:center;padding:30px">${esc(t('gs_loading'))}</div>`;
  const hdr = {headers:{'X-GH-Token':_token}};
  let sum = null, overall = null;
  try {
    const [a, b] = await Promise.all([fetch(`${BASE}/summary/${encodeURIComponent(myId)}`, hdr), fetch(`${BASE}/overall`, hdr), GHLibrary.load(_token)]);
    sum = a.ok ? await a.json() : null;
    overall = b.ok ? await b.json() : null;
  } catch(_) {}
  const me = overall?.players?.find(p => p.player_id === myId);
  const cell = (v, l) => `<div class="stat-cell"><div class="stat-val">${v}</div><div class="stat-lbl">${esc(l)}</div></div>`;

  let body = '';
  if (!sum || !sum.played) {
    body = `<div style="color:var(--fg2);text-align:center;padding:20px 0">${esc(t('gp_nothing_yet'))}</div>`;
  } else {
    body = `
      <div class="stat-box">
        ${cell(me ? '#' + me.place : '—', t('gs_overall_place'))}
        ${cell(me ? me.points.toLocaleString(undefined,{maximumFractionDigits:1}) : '0', t('gs_points'))}
        ${cell(sum.games.length, t('gs_games'))}
      </div>
      <div class="stat-box">
        ${cell(sum.played, t('gs_games_played'))}
        ${cell(sum.solo, t('gp_solo_games'))}
        ${cell(_fmtTime(sum.seconds), t('gs_time_played'))}
      </div>
      <div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg2);margin-bottom:6px">${esc(t('gp_multi_section'))}</div>
        <div class="stat-box">
          ${cell(sum.multi, t('gp_multi_games'))}
          ${cell(sum.wins, t('gs_wins'))}
          ${cell(sum.win_rate == null ? '—' : Math.round(sum.win_rate) + '%', t('gs_win_rate'))}
        </div>
      </div>
      <div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg2);margin-bottom:6px">${esc(t('gp_by_game'))}</div>
        <div style="overflow-x:auto"><table class="lb-table">
          <thead><tr><th>${esc(t('gp_col_game'))}</th><th>${esc(t('gp_col_solo'))}</th><th>${esc(t('gp_col_multi'))}</th><th>${esc(t('gp_col_wins'))}</th><th>${esc(t('gp_col_rate'))}</th></tr></thead>
          <tbody>${sum.games.map(g => { const gm = _gameMeta(g.game_id); return `
            <tr><td style="font-weight:600">${gm.iconHTML} ${esc(gm.name)}</td><td>${g.solo}</td><td>${g.multi}</td>
            <td>${g.multi ? g.wins : '—'}</td><td style="font-weight:700">${g.win_rate == null ? '—' : Math.round(g.win_rate) + '%'}</td></tr>`; }).join('')}</tbody>
        </table></div>
        <div style="font-size:11px;color:var(--fg2);margin-top:6px">${esc(t('gp_rate_hint'))}</div>
      </div>`;
  }

  c.innerHTML = `
    <div class="section" style="display:flex;flex-direction:column;gap:16px;max-width:600px">
      <a href="/pub/apphub/?token=${_token}&tab=profile" style="display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;cursor:pointer" title="${esc(t('gh_edit_profile_title'))}">
        ${GHAvatar.renderAvatar(_me, 54)}
        <div>
          <div style="font-weight:700;font-size:1.1rem">${esc(_me.display_name)}</div>
          <div style="font-size:.85rem;color:var(--fg2)">@${esc(_me.username)}</div>
        </div>
      </a>
      ${body}
    </div>`;
}


function showSessionDetail(s, myId) {
  let meta = {}; try { meta = JSON.parse(s.metadata||'{}'); } catch(_) {}
  const modeLabel = s.mode==='singleplayer'?t('gh_single_player_full'):t('gh_multiplayer_full');
  const sorted = s.players.slice().sort((a,b)=>(b.score||0)-(a.score||0));
  const fmtDurLocal = sec => !sec?'—':sec<60?sec+'s':Math.floor(sec/60)+'m'+(sec%60?sec%60+'s':'');
  const metaRows = [];
  if(meta.rounds!=null)         metaRows.push([t('gh_rounds'), meta.rounds]);
  if(meta.time_per_round!=null) metaRows.push([t('gh_time_per_round'), meta.time_per_round===0?t('gh_no_limit'):fmtDurLocal(meta.time_per_round)]);
  if(s.duration_seconds)        metaRows.push([t('gh_total_time'), fmtDurLocal(s.duration_seconds)]);
  metaRows.push([t('gh_mode'), modeLabel]);
  metaRows.push([t('gh_date'), fmtDate(s.played_at)]);

  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px';

  const box = document.createElement('div');
  box.className = 'card';
  box.style.cssText = 'width:100%;max-width:400px;max-height:90dvh;overflow-y:auto;display:flex;flex-direction:column';
  box.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0">
      <span style="font-size:20px">🎮</span>
      <div style="flex:1"><div style="font-weight:700">${esc(s.game_id)}</div><div style="font-size:12px;color:var(--fg2)">${modeLabel}</div></div>
      <button id="det-close" class="btn btn-secondary" style="padding:4px 10px;font-size:15px;line-height:1">✕</button>
    </div>
    <div style="padding:14px 16px;display:flex;flex-direction:column;gap:14px">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        ${metaRows.map(([k,v])=>`<tr><td style="color:var(--fg2);padding:3px 0;width:46%">${esc(String(k))}</td><td style="font-weight:600">${esc(String(v))}</td></tr>`).join('')}
      </table>
      <div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg2);margin-bottom:8px">${esc(t('gh_players'))}</div>
        <div id="det-players"></div>
      </div>
    </div>`;

  const playersEl = box.querySelector('#det-players');
  sorted.forEach((p, i) => {
    const name  = p.display_name || p.guest_name || '?';
    const color = p.avatar_color || '#585b70';
    const isMe  = p.player_id === myId;
    const isOther = p.player_id && !isMe;
    const isWin = p.is_winner && s.mode === 'multiplayer';
    const row = document.createElement('div');
    row.style.cssText = `display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;margin-bottom:4px;background:${isWin?'rgba(166,227,161,.12)':'var(--surface2)'};${isMe?'outline:1px solid var(--accent)':''}${isOther?';cursor:pointer':''}`;
    if (isOther) {
      row.onmouseenter = () => row.style.opacity = '.8';
      row.onmouseleave = () => row.style.opacity = '1';
      row.onclick = () => {
        const full = (_stats?.players||[]).find(pl=>pl.id===p.player_id) || p;
        showOtherPlayerProfile(full);
      };
    }
    row.innerHTML = `
      <span style="font-size:12px;color:var(--fg2);min-width:18px;text-align:right">${i+1}.</span>
      ${GHAvatar.renderAvatar(p.player_id ? ((_stats?.players||[]).find(pl=>pl.id===p.player_id)||p) : p, 26)}
      <span style="flex:1;font-weight:600;font-size:13px">${esc(name)}${isMe?` <span style="font-size:10px;color:var(--accent)">(${esc(t('gh_you'))})</span>`:''}${isOther?' <span style="font-size:10px;color:var(--fg2)">›</span>':''}</span>
      ${p.score!=null?`<span style="font-weight:700;font-size:14px">${p.score}</span>`:''}
      ${isWin?`<span style="font-size:13px">🏆</span>`:''}`;
    playersEl.appendChild(row);
  });

  ov.appendChild(box);
  document.body.appendChild(ov);
  box.querySelector('#det-close').onclick = () => ov.remove();
  ov.addEventListener('click', e => { if(e.target===ov) ov.remove(); });
}

function showOtherPlayerProfile(p) {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px';

  const box = document.createElement('div');
  box.className = 'card';
  box.style.cssText = 'width:100%;max-width:480px;max-height:90dvh;overflow-y:auto;display:flex;flex-direction:column';
  const isSelf = _me && _me.id === p.id;
  box.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border);flex-shrink:0">
      ${GHAvatar.renderAvatar(p, 46)}
      <div style="flex:1">
        <div style="font-weight:700;font-size:16px">${esc(p.display_name||p.username||'?')}</div>
        ${p.username?`<div style="font-size:12px;color:var(--fg2)">@${esc(p.username)}</div>`:''}
      </div>
      <button id="op-fav" class="btn btn-secondary" style="padding:5px 10px;font-size:12px">${_isFav(p.id)?esc(t('gh_fav_saved')):esc(t('gh_fav_add'))}</button>
      <button id="op-close" class="btn btn-secondary" style="padding:4px 10px;font-size:15px;line-height:1">✕</button>
    </div>
    <div id="op-filter" style="padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;display:none;align-items:center;gap:8px"></div>
    <div id="op-stats" style="display:flex;flex-shrink:0"></div>
    <div id="op-versus"></div>
    <div id="op-hist" style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap"></div>
    <div id="op-sessions" style="padding:0 14px 14px;display:flex;flex-direction:column;gap:6px"></div>`;

  ov.appendChild(box);
  document.body.appendChild(ov);
  box.querySelector('#op-close').onclick = () => ov.remove();
  ov.addEventListener('click', e => { if(e.target===ov) ov.remove(); });

  const favBtn = box.querySelector('#op-fav');
  favBtn.onclick = async () => {
    await _toggleFav(p);
    favBtn.textContent = _isFav(p.id) ? t('gh_fav_saved') : t('gh_fav_add');
  };

  let current = '';       // the game this view is narrowed to
  let openList = null;    // which history list is showing: 'all', 'shared' or null

  // The list of games is not loaded until somebody asks for it: it is long, and
  // most of the time the comparison above it is all that is wanted.
  async function showHistory(kind) {
    const sc = box.querySelector('#op-sessions');
    sc.innerHTML = '';
    if (openList === kind) { openList = null; drawHistButtons(); return; }
    openList = kind;
    drawHistButtons();
    sc.innerHTML = `<div style="color:var(--fg2);text-align:center;padding:14px">${esc(t('gs_loading'))}</div>`;
    let list = [];
    try {
      const r = await fetch(`${BASE}/history/${encodeURIComponent(p.id)}?shared=${kind === 'shared' ? 1 : 0}${current ? '&game=' + encodeURIComponent(current) : ''}`, {headers:{'X-GH-Token':_token}});
      list = r.ok ? await r.json() : [];
    } catch(_) {}
    if (openList !== kind) return;
    sc.innerHTML = '';
    if (!list.length) { sc.innerHTML = `<div style="color:var(--fg2);text-align:center;padding:14px">${esc(t('gh_no_sessions'))}</div>`; return; }
    list.forEach(s => {
      let meta = {}; try { meta = JSON.parse(s.metadata||'{}'); } catch(_) {}
      const metaParts = [];
      if(meta.rounds!=null)         metaParts.push(`${meta.rounds} ${t('gh_rounds_suffix')}`);
      if(meta.time_per_round!=null) metaParts.push(meta.time_per_round===0?t('gh_no_limit_lower'):fmtDur(meta.time_per_round)+t('gh_per_round_suffix'));
      const modeLabel = s.mode==='singleplayer'?'👤':'👥';
      const pr = s.players.find(sp=>sp.player_id===p.id);
      const gm = _gameMeta(s.game_id);
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div style="font-size:18px">${gm.iconHTML}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${!current?esc(gm.name)+' ':''}${modeLabel} ${fmtDate(s.played_at)}</div>
          ${metaParts.length?`<div style="font-size:11px;color:var(--fg2)">${metaParts.join(' · ')}</div>`:''}
        </div>
        <div style="text-align:right;flex-shrink:0">
          ${pr?.score!=null?`<div style="font-weight:700;font-size:14px">${pr.score} pts</div>`:''}
          ${pr?.is_winner && s.mode==='multiplayer'?`<div class="badge-win">🏆</div>`:''}
        </div>`;
      row.onclick = () => showSessionDetail(s, _me.id);
      sc.appendChild(row);
    });
  }

  function drawHistButtons() {
    const h = box.querySelector('#op-hist');
    const btn = (kind, label) => `<button class="btn btn-secondary" data-h="${kind}" style="padding:6px 12px;font-size:.8rem${openList===kind?';background:var(--accent);color:#1e1e2e':''}">${esc(label)}${openList===kind?' ▴':' ▾'}</button>`;
    h.innerHTML = btn('all', t('gv_history')) + (isSelf ? '' : btn('shared', t('gv_shared_history')));
    h.querySelectorAll('[data-h]').forEach(b => b.onclick = () => showHistory(b.dataset.h));
  }

  // Totals are counted by the server over the whole history.
  async function show(gameFilter) {
    current = gameFilter;
    openList = null;
    box.querySelector('#op-sessions').innerHTML = '';
    drawHistButtons();
    let d = null;
    try {
      const r = await fetch(`${BASE}/summary/${encodeURIComponent(p.id)}`, {headers:{'X-GH-Token':_token}});
      d = r.ok ? await r.json() : null;
    } catch(_) {}
    if (!d) return;
    const rows = gameFilter ? d.games.filter(g => g.game_id === gameFilter) : d.games;
    const solo = rows.reduce((a,g)=>a+g.solo,0), multi = rows.reduce((a,g)=>a+g.multi,0), wins = rows.reduce((a,g)=>a+g.wins,0);
    const cols = [[solo+multi, t('gs_games_played')], [multi ? wins : '—', t('gs_wins')], [multi ? Math.round(100*wins/multi)+'%' : '—', t('gs_win_rate')]];
    box.querySelector('#op-stats').innerHTML = cols.map(([v,l],i) => `
      <div style="flex:1;text-align:center;padding:12px 8px;${i<cols.length-1?'border-right:1px solid var(--border)':''}">
        <div style="font-size:20px;font-weight:700">${v}</div>
        <div style="font-size:11px;color:var(--fg2);margin-top:2px">${esc(l)}</div>
      </div>`).join('');

    const filter = box.querySelector('#op-filter');
    if (d.games.length > 1) {
      filter.style.display = 'flex';
      if (!filter.firstChild) {
        filter.innerHTML = `<label style="font-size:12px;color:var(--fg2)">${esc(t('gh_game_label'))}</label>
          <select class="inp" style="flex:1;max-width:220px"><option value="">${esc(t('gh_all_games'))}</option>
          ${d.games.map(g=>`<option value="${esc(g.game_id)}">${esc(_gameMeta(g.game_id).name)}</option>`).join('')}</select>`;
        filter.querySelector('select').onchange = e => show(e.target.value);
      }
      filter.querySelector('select').value = gameFilter;
    }

    const vs = box.querySelector('#op-versus');
    if (isSelf) { vs.innerHTML = ''; return; }
    GHStats.renderVersus(vs, {
      otherId: p.id, otherName: p.display_name || p.username, myName: _me.display_name, token: _token, game: gameFilter,
      gameInfo: id => _gameMeta(id),
      onGame: id => show(id),
    });
  }

  show('');
}

// ── Games tab ───────────────────────────────────────────────────

function _gameMeta(gameId) {
  const g = window.GHLibrary && GHLibrary.find(gameId);
  if (g) return { name: GHLibrary.gameName(g), icon: g.icon || '🎮', iconHTML: iconHTML(g) };
  const m = _stats?.game_meta?.[gameId];
  return { name: m?.name || gameId, icon: m?.icon || '🎮', iconHTML: iconHTML(m) };
}

const MP_API = '/api/pub/gamehub/mp';

// ?game=<id> — the deep link a game's desktop window opens (see core's
// frontend/gamelauncher.js). The whole point of that window is to drop the
// player straight into this game, so skip the grid. Consumed once: the detail
// page's Back button re-renders the grid and must not bounce back here.
let _deepLinkGame = new URLSearchParams(location.search).get('game');

// Whether a game can be played by more than one person. Games predating this
// flag say nothing in their manifest and stay multiplayer, as they were.
function _isMultiplayer(mpGame) {
  return !!mpGame && mpGame.multiplayer !== false && (mpGame.max_players == null || mpGame.max_players > 1);
}

// ── Rooms you are still in ────────────────────────────────────────
// A run you walked away from lives on the server for a while (see
// EMPTY_GRACE / ROOM_TTL in backend/apps/gamehub/mp.py), so coming back here
// has to offer it — otherwise the only button in sight starts a fresh game and
// the half-finished one is silently lost. /rooms is no help: it lists open
// lobbies for other people and so skips solo rooms and rooms already playing,
// which are exactly the ones you want back.
let _myRooms = [];
let _myRoomsLoaded = false;

function _dismissed() {
  try { return JSON.parse(localStorage.getItem('gh_dismissed_rooms') || '[]'); } catch(_) { return []; }
}
function _dismissRoom(roomId) {
  const list = _dismissed().filter(id => id !== roomId);
  list.push(roomId);
  try { localStorage.setItem('gh_dismissed_rooms', JSON.stringify(list.slice(-20))); } catch(_) {}
  _myRooms = _myRooms.filter(r => r.room_id !== roomId);
}

async function _loadMyRooms(force) {
  if (_myRoomsLoaded && !force) return _myRooms;
  _myRoomsLoaded = true;
  try {
    const r = await fetch(MP_API + '/rooms/mine', { headers: { 'X-GH-Token': _token } });
    const rooms = r.ok ? await r.json() : [];
    // A dismissed banner only hides the banner. The Continue button on the
    // game itself keeps showing the room, because that is a deliberate ask.
    _myRooms = Array.isArray(rooms) ? rooms : [];
  } catch(_) { _myRooms = []; }
  return _myRooms;
}

function _myRoomFor(gameId) {
  return _myRooms.find(r => r.game_id === gameId) || null;
}

// Solo runs are the ones with a one-at-a-time rule, so they are worth telling
// apart from a multiplayer room the player happens to be in.
function _mySoloRunFor(gameId) {
  return _myRooms.find(r => r.game_id === gameId && r.max_players <= 1) || null;
}

async function _discardRun(roomId) {
  try {
    const r = await fetch(MP_API + '/rooms/' + encodeURIComponent(roomId), {
      method: 'DELETE', headers: { 'X-GH-Token': _token },
    });
    if (!r.ok) return false;
    _myRooms = _myRooms.filter(x => x.room_id !== roomId);
    return true;
  } catch(_) { return false; }
}

// ── Saved games ───────────────────────────────────────────────────────────
// A run in progress and a saved game are different things and a player is
// never in both at once (the server enforces it). A run is the one you walked
// away from and can walk back into; a save is the one you deliberately put
// down. So starting a game is one of three: straight into a new run, back into
// the run you left, or a question — continue the save, or throw it away?
let _mySaves = [];

async function _loadMySaves() {
  try {
    const r = await fetch(MP_API + '/saves', { headers: { 'X-GH-Token': _token } });
    const s = r.ok ? await r.json() : [];
    _mySaves = Array.isArray(s) ? s : [];
  } catch(_) { _mySaves = []; }
  return _mySaves;
}

function _mySaveFor(gameId) {
  return _mySaves.find(s => s.game_id === gameId) || null;
}

// Continue the save, or start over and lose it. Resolves to true / false /
// null (cancelled).
function _askSavedGame(gameId, save) {
  return new Promise(resolve => {
    const { name, icon, iconHTML: iconH } = _gameMeta(gameId);
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px';
    const box = document.createElement('div');
    box.className = 'card';
    box.style.cssText = 'width:100%;max-width:380px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px';
    box.innerHTML = `
      <div style="font-size:34px;line-height:1">${iconH}</div>
      <div style="font-weight:700;font-size:16px">${esc(t('gh_saved_game_title'))}</div>
      <div style="font-size:13px;color:var(--fg2)">${esc(t('gh_saved_game_body', { game: name }))}</div>
      ${save && save.updated_at ? `<div style="font-size:11px;color:var(--fg2)">${esc(fmtDate(new Date(save.updated_at * 1000).toISOString()))}</div>` : ''}
      <button class="btn btn-primary" data-a="resume" style="padding:9px 18px">${esc(t('gh_resume_saved'))}</button>
      <button class="btn btn-secondary" data-a="fresh" style="padding:9px 18px">${esc(t('gh_start_fresh'))}</button>
      <button class="btn btn-secondary" data-a="cancel" style="padding:6px 12px;font-size:.8rem;border:none;background:none;color:var(--fg2)">${esc(t('gh_cancel'))}</button>`;
    ov.appendChild(box);
    document.body.appendChild(ov);
    const done = v => { ov.remove(); resolve(v); };
    box.querySelector('[data-a="resume"]').onclick = () => done(true);
    box.querySelector('[data-a="fresh"]').onclick  = () => {
      if (confirm(t('gh_start_fresh_confirm'))) done(false);
    };
    box.querySelector('[data-a="cancel"]').onclick = () => done(null);
    ov.onclick = e => { if (e.target === ov) done(null); };
  });
}

async function renderGames(c) {
  c.innerHTML = `<div style="display:flex;flex-direction:column;gap:16px"></div>`;
  const sc = c.querySelector('div');
  const myId = _me.id;
  await GHLibrary.load(_token, true);

  // ── Resume: games you are still in ─────────────────────────
  // Asked of the server, not of localStorage. The old version read a
  // `gh_active_room` key that nothing ever wrote, so this banner never
  // appeared — and a room you walk away from is on the server anyway, which
  // means it also finds you in a different browser.
  await _loadMyRooms(true);
  await _loadMySaves();
  const _hidden = _dismissed();
  for (const active of _myRooms.filter(r => !_hidden.includes(r.room_id))) {
    const { name, iconHTML: iconH } = _gameMeta(active.game_id);
    const sec = document.createElement('div');
    sec.style.cssText = 'background:rgba(137,180,250,.1);border:1px solid rgba(137,180,250,.3);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px';
    sec.innerHTML = `
      <div style="font-size:24px">${iconH}</div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:14px">${esc(name)} ${esc(t('gh_active_game_suffix'))}</div>
        <div style="font-size:12px;color:var(--fg2);margin-top:2px">${esc(t('gh_rejoin_prompt'))}</div>
      </div>
      <a href="${esc(active.play_url)}" class="btn btn-primary" style="font-size:.85rem;padding:7px 16px;text-decoration:none;flex-shrink:0">${esc(t('gh_rejoin'))}</a>
      <button class="btn btn-secondary" data-dismiss style="padding:7px 10px;font-size:.85rem;flex-shrink:0">✕</button>`;
    sc.appendChild(sec);
    sec.querySelector('[data-dismiss]').onclick = () => { _dismissRoom(active.room_id); sec.remove(); };
  }

  // ── Invitations ───────────────────────────────────────────────
  if (_invites.length) {
    const invSec = document.createElement('div');
    invSec.style.cssText = 'display:flex;flex-direction:column;gap:8px';
    invSec.innerHTML = `<div style="font-weight:700;font-size:13px;color:var(--red)">${esc(t('gh_invitations'))}</div>`;
    _invites.forEach(inv => {
      const { name: gname, iconHTML: gicon } = _gameMeta(inv.game_id);
      const banner = document.createElement('div');
      banner.style.cssText = 'background:rgba(243,139,168,.1);border:1px solid rgba(243,139,168,.3);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px';
      banner.innerHTML = `
        <div style="font-size:22px;flex-shrink:0">${gicon}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${esc(gname)} — ${esc(t('gh_invited_by'))} <span style="color:var(--accent)">${esc(inv.from_name)}</span></div>
          <div style="font-size:11px;color:var(--fg2);margin-top:2px">${fmtDate(inv.created_at)}</div>
        </div>
        <a href="${esc(inv.room_url)}" class="btn btn-primary" style="padding:7px 16px;font-size:.85rem;text-decoration:none;flex-shrink:0">${esc(t('gh_join'))}</a>
        <button class="btn btn-secondary" style="padding:7px 10px;font-size:.85rem;flex-shrink:0" data-inv-id="${inv.id}">✕</button>`;
      banner.querySelector('[data-inv-id]').onclick = async () => {
        await fetch(`${BASE}/invites/${inv.id}`, {method:'DELETE',headers:{'X-GH-Token':_token}}).catch(()=>{});
        _invites = _invites.filter(i=>i.id!==inv.id);
        banner.remove();
        if (!invSec.querySelector('[data-inv-id]')) invSec.remove();
      };
      invSec.appendChild(banner);
    });
    sc.appendChild(invSec);
  }

  // ── The player's own games ───────────────────────────────────
  // Every game on the server is offered in the Store tab; this page shows the
  // ones this profile chose, filtered by category and sorted as it likes.
  const lib = GHLibrary.find;

  const shelf = document.createElement('div');
  shelf.style.cssText = 'display:flex;flex-direction:column;gap:14px';
  sc.appendChild(shelf);

  const cardFor = game => {
    const gameId = game.id;
    const name = GHLibrary.gameName(game), icon = game.icon || '🎮', iconH = iconHTML(game);
    const hasInvite = _invites.some(inv => inv.game_id === gameId);

    const card = document.createElement('div');
    card.style.cssText = 'background:var(--surface1);border:1px solid var(--border);border-radius:14px;padding:20px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:background .12s;position:relative;text-align:center';
    card.onmouseenter = () => card.style.background = 'var(--surface2)';
    card.onmouseleave = () => card.style.background = 'var(--surface1)';

    const badge = hasInvite ? `<span style="position:absolute;top:10px;right:10px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:2px 7px">!</span>` : '';
    // A game that declares "multiplayer": false in its manifest is a solo
    // game, so it must not advertise itself as multiplayer on the card.
    const modeLabel = _isMultiplayer(game) ? t('gh_multiplayer_short') : t('gh_singleplayer_short');
    // What is waiting in this game outranks how much of it you have played —
    // a saved game is easy to forget you have, and the card is where you look.
    const subtext = _myRoomFor(gameId) ? t('gh_run_in_progress_short')
      : _mySaveFor(gameId) ? t('gh_saved_game_short')
      : game.open_count ? `${game.open_count} ${t('gh_sessions_suffix').toLowerCase()}` : modeLabel;

    card.innerHTML = `
      ${badge}
      <div style="font-size:42px;line-height:1">${iconH}</div>
      <div style="font-weight:700;font-size:13px">${esc(name)}</div>
      ${subtext ? `<div style="font-size:11px;color:var(--fg2)">${esc(subtext)}</div>` : ''}`;
    card.onclick = () => renderGameDetail(c, gameId, game);
    return card;
  };

  GHLibrary.renderShelf(shelf, {
    token: _token, cardFor,
    openStore: () => app.querySelector('.tab[data-t="store"]')?.click(),
  });

  if (_deepLinkGame) {
    const wanted = _deepLinkGame;
    _deepLinkGame = null;
    if (lib(wanted)) renderGameDetail(c, wanted, lib(wanted));
  }
}

async function _createGame(btn, gameId, maxPlayers, resume) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = t('gh_creating');
  const restore = () => { btn.disabled = false; btn.textContent = label; };
  try {
    const body = { game_id: gameId };
    if (maxPlayers) body.max_players = maxPlayers;
    if (resume != null) body.resume = !!resume;
    const r = await fetch(MP_API + '/rooms', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-GH-Token': _token },
      body: JSON.stringify(body),
    });
    if (r.ok) {
      const d = await r.json();
      location.href = d.play_url;
      return;
    }
    // The server is the one that knows a run or a save is in the way, and it
    // says so instead of quietly making a second one.
    if (r.status === 409) {
      const d = await r.json().catch(() => ({}));
      if (d.error === 'run_in_progress' && d.play_url) { location.href = d.play_url; return; }
      if (d.error === 'saved_game') {
        restore();
        await _loadMySaves();
        const answer = await _askSavedGame(gameId, _mySaveFor(gameId));
        if (answer === null) return;
        return _createGame(btn, gameId, maxPlayers, answer);
      }
    }
    restore();
    alert(t('gh_error_creating'));
  } catch(_) { restore(); }
}

async function renderGameDetail(c, gameId, mpGame) {
  const myId = _me.id;
  const { name, icon, iconHTML: iconH } = _gameMeta(gameId);
  c.innerHTML = `<div class="section" data-view="detail" style="display:flex;flex-direction:column;gap:16px;max-width:720px"></div>`;
  const sc = c.querySelector('.section');

  // Back button
  const back = document.createElement('button');
  back.className = 'btn btn-secondary';
  back.style.cssText = 'width:fit-content;padding:6px 12px;font-size:.85rem';
  back.textContent = t('gh_back_games');
  back.onclick = () => renderGames(c);
  sc.appendChild(back);

  // Tab bar
  const tabBar = document.createElement('div');
  tabBar.className = 'tab-bar';
  tabBar.style.cssText = 'margin:0 -16px;padding:0 16px';
  tabBar.innerHTML = `
    <button class="tab active" data-gt="play">${iconH} ${esc(name)}</button>
    <button class="tab" data-gt="history">${esc(t('gh_history'))}</button>
    <button class="tab" data-gt="leaderboard">${esc(t('gs_stats'))}</button>`;
  sc.appendChild(tabBar);

  const tabBody = document.createElement('div');
  tabBody.id = 'gd-tab-body';
  sc.appendChild(tabBody);

  // NB: not named `t` — that is the global translation function, and shadowing
  // it here made every t('gh_…') in this body throw "t is not a function".
  async function renderGdTab(tab) {
    tabBar.querySelectorAll('.tab[data-gt]').forEach(x => x.classList.toggle('active', x.dataset.gt === tab));

    if (tab === 'play') {
      // Game info + new game + active rooms + invitations
      tabBody.innerHTML = '';
      const info = document.createElement('div');
      info.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 0 8px;text-align:center';
      // A solo-only game gets one prominent Play button instead of a Solo /
      // Multiplayer pair that would offer a mode it does not have.
      const isMp = _isMultiplayer(mpGame);
      // A run of this game you are still in. It comes first and takes the
      // primary colour, because the alternative — starting over — is the one
      // thing a returning player does not want to do by accident.
      if (mpGame) { await _loadMyRooms(true); await _loadMySaves(); }
      const mine  = mpGame ? _myRoomFor(gameId) : null;
      const solo  = mpGame ? _mySoloRunFor(gameId) : null;
      const saved = mpGame ? _mySaveFor(gameId) : null;
      // An unfinished solo run leaves no way to start a second one: two
      // half-played runs of the same game is a state nobody can make sense of,
      // and the run is what the player came back for. Multiplayer is untouched
      // by this — a match is not a thing you hold on to.
      const soloBlocked = !!solo;
      info.innerHTML = `
        <div style="font-size:56px;line-height:1">${iconH}</div>
        <div style="font-weight:700;font-size:20px">${esc(name)}</div>
        ${mpGame ? `
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          ${mine ? `<a href="${esc(mine.play_url)}" class="btn btn-primary" style="padding:9px 20px;font-size:.95rem;text-decoration:none">▶ ${esc(t('gh_continue'))}</a>` : ''}
          ${soloBlocked ? `<button class="btn btn-secondary" id="gd-discard" style="padding:9px 14px;font-size:.95rem" title="${esc(t('gh_discard_run'))}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 10v6"/><path d="M14 10v6"/></svg></button>` : ''}
          ${soloBlocked ? '' : `<button class="btn ${isMp || mine ? 'btn-secondary' : 'btn-primary'}" id="gd-solo" style="padding:9px 20px;font-size:.95rem">${esc(isMp ? t('gh_play_solo') : saved ? t('gh_play_saved') : t('gh_play'))}</button>`}
          ${isMp ? `<button class="btn ${mine ? 'btn-secondary' : 'btn-primary'}" id="gd-new" style="padding:9px 20px;font-size:.95rem">${esc(t('gh_new_game'))}</button>` : ''}
        </div>
        ${mine ? `<div style="font-size:12px;color:var(--fg2);margin-top:-4px">${esc(t(soloBlocked ? 'gh_run_in_progress_hint' : 'gh_continue_hint'))}</div>` : ''}
        ${!mine && saved ? `<div style="font-size:12px;color:var(--fg2);margin-top:-4px">${esc(t('gh_has_saved_hint'))}</div>` : ''}` : ''}`;
      tabBody.appendChild(info);
      if (mpGame) {
        info.querySelector('#gd-new')?.addEventListener('click', e => _createGame(e.target, gameId));
        info.querySelector('#gd-solo')?.addEventListener('click', e => _createGame(e.target, gameId, 1));
        info.querySelector('#gd-discard')?.addEventListener('click', async e => {
          if (!confirm(t('gh_discard_run_confirm'))) return;
          e.target.disabled = true;
          if (await _discardRun(solo.room_id)) renderGdTab('play');
          else { e.target.disabled = false; alert(t('gh_error_creating')); }
        });
      }

      if (isMp) {
        let rooms = [];
        try { const r = await fetch(MP_API + '/rooms?game_id=' + encodeURIComponent(gameId)); rooms = r.ok ? await r.json() : []; } catch(_) {}
        if (rooms.length) {
          const roomsSec = document.createElement('div');
          roomsSec.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin-top:8px';
          roomsSec.innerHTML = `<div style="font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg2)">${esc(t('gh_open_lobbies'))}</div>`;
          rooms.forEach(room => {
            const row = document.createElement('div');
            row.style.cssText = 'background:var(--surface1);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:12px';
            row.innerHTML = `
              <div style="flex:1;min-width:0">
                <div style="font-size:.88rem;font-weight:600">${esc(room.host_name || t('gh_game_default'))}</div>
                <div style="font-size:.75rem;color:var(--fg2);margin-top:2px">${esc(t('gh_lobby_players',{n:room.players,s:room.players!==1?'s':''}))}</div>
              </div>
              <a href="${esc(room.play_url)}" class="btn btn-primary" style="font-size:.82rem;padding:6px 14px;text-decoration:none;flex-shrink:0">${esc(t('gh_join'))}</a>`;
            roomsSec.appendChild(row);
          });
          tabBody.appendChild(roomsSec);
        }
      }

      const gameInvites = _invites.filter(inv => inv.game_id === gameId);
      if (gameInvites.length) {
        const invSection = document.createElement('div');
        invSection.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin-top:8px';
        invSection.innerHTML = `<div style="font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--red)">${esc(t('gh_invitations'))}</div>`;
        gameInvites.forEach(inv => {
          const banner = document.createElement('div');
          banner.style.cssText = 'background:rgba(243,139,168,.1);border:1px solid rgba(243,139,168,.3);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px';
          banner.innerHTML = `
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600">${esc(t('gh_invited_by'))} <span style="color:var(--accent)">${esc(inv.from_name)}</span></div>
              <div style="font-size:11px;color:var(--fg2);margin-top:2px">${fmtDate(inv.created_at)}</div>
            </div>
            <a href="${esc(inv.room_url)}" class="btn btn-primary" style="padding:7px 16px;font-size:.85rem;text-decoration:none;flex-shrink:0">${esc(t('gh_join'))}</a>
            <button class="btn btn-secondary" style="padding:7px 10px;font-size:.85rem;flex-shrink:0" data-inv-id="${inv.id}">✕</button>`;
          banner.querySelector('[data-inv-id]').onclick = async () => {
            await fetch(`${BASE}/invites/${inv.id}`, {method:'DELETE',headers:{'X-GH-Token':_token}}).catch(()=>{});
            _invites = _invites.filter(i=>i.id!==inv.id);
            banner.remove();
            if (!invSection.querySelector('[data-inv-id]')) invSection.remove();
          };
          invSection.appendChild(banner);
        });
        tabBody.appendChild(invSection);
      }

    } else if (tab === 'history') {
      tabBody.innerHTML = '';
      const mySess = (_stats?.recent||[]).filter(s=>s.game_id===gameId && s.players.some(p=>p.player_id===myId));
      if (!mySess.length) {
        tabBody.innerHTML = `<div style="color:var(--fg2);font-size:13px;padding:20px 0;text-align:center">${esc(t('gh_no_sessions'))}</div>`;
      } else {
        mySess.forEach(s => {
          let meta = {}; try { meta = JSON.parse(s.metadata||'{}'); } catch(_) {}
          const metaParts = [];
          if(meta.rounds!=null)         metaParts.push(`${meta.rounds} ${t('gh_rounds_suffix')}`);
          if(meta.time_per_round!=null) metaParts.push(meta.time_per_round===0?t('gh_no_limit_lower'):fmtDur(meta.time_per_round)+t('gh_per_round_suffix'));
          const modeLabel = s.mode==='singleplayer'?'👤':'👥';
          const myResult = s.players.find(p=>p.player_id===myId);
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = `
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600">${modeLabel} ${fmtDate(s.played_at)}${s.duration_seconds?' · '+fmtDur(s.duration_seconds):''}</div>
              ${metaParts.length?`<div style="font-size:11px;color:var(--fg2)">${metaParts.join(' · ')}</div>`:''}
            </div>
            <div style="text-align:right;flex-shrink:0">
              ${myResult?.score!=null?`<div style="font-weight:700;font-size:14px">${myResult.score} pts</div>`:''}
              ${myResult?.is_winner && s.mode==='multiplayer'?`<div class="badge-win">🏆</div>`:''}
            </div>`;
          row.onclick = () => showSessionDetail(s, myId);
          tabBody.appendChild(row);
        });
      }

    } else if (tab === 'leaderboard') {
      // The numbers a game reports are drawn by the shared statistics module;
      // nothing on this page knows which game it is looking at.
      GHStats.renderGame(tabBody, {
        gameId, name, icon, myId, token: _token,
        favIds: () => (_favs || []).map(f => f.id),
        onPlayer: p => showOtherPlayerProfile((_stats?.players || []).find(pl => pl.id === p.id) || p),
      });
    }
  }

  tabBar.querySelectorAll('.tab[data-gt]').forEach(btn => { btn.onclick = () => renderGdTab(btn.dataset.gt); });
  await renderGdTab('play');
}

// ── Favourites helpers ──────────────────────────────────────────

let _favs = null; // cache

async function _loadFavs() {
  if (!_token) { _favs = []; return; }
  const r = await fetch(BASE + '/favourites', {headers:{'X-GH-Token':_token}});
  _favs = r.ok ? await r.json() : [];
}
function _isFav(playerId) { return !!(_favs && _favs.some(f=>f.id===playerId)); }
async function _toggleFav(p) {
  if (!_token) return;
  const isFav = _isFav(p.id);
  await fetch(`${BASE}/favourites/${p.id}`, {method: isFav ? 'DELETE' : 'POST', headers:{'X-GH-Token':_token}});
  if (isFav) { _favs = (_favs||[]).filter(f=>f.id!==p.id); }
  else { _favs = [p, ...(_favs||[]).filter(f=>f.id!==p.id)]; }
}

// ── Favourites tab ──────────────────────────────────────────────

async function renderFavourites(c) {
  c.innerHTML = `<div class="section" style="display:flex;flex-direction:column;gap:14px;max-width:560px"></div>`;
  const sc = c.querySelector('.section');

  if (_favs === null) await _loadFavs();

  // Search
  const searchWrap = document.createElement('div');
  searchWrap.innerHTML = `
    <div style="font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg2);margin-bottom:8px">${esc(t('gh_find_player'))}</div>
    <input class="inp" id="fav-search" placeholder="${esc(t('gh_search_placeholder'))}" autocomplete="off">
    <div id="fav-results" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>`;
  sc.appendChild(searchWrap);

  const resultsEl = searchWrap.querySelector('#fav-results');
  let _searchTimer = null;

  async function renderSearch(q) {
    resultsEl.innerHTML = '';
    if (q.length < 2) return;
    resultsEl.innerHTML = `<div style="color:var(--fg2);font-size:13px">${esc(t('gh_searching'))}</div>`;
    const r = await fetch(`/api/pub/apphub/search?q=${encodeURIComponent(q)}`);
    const hits = r.ok ? (await r.json()).filter(p => p.id !== _me?.id) : [];
    resultsEl.innerHTML = '';
    if (!hits.length) {
      resultsEl.innerHTML = `<div style="color:var(--fg2);font-size:13px">${esc(t('gh_no_players_found'))}</div>`;
      return;
    }
    hits.forEach(p => resultsEl.appendChild(_playerRow(p, () => renderFavourites(c))));
  }

  searchWrap.querySelector('#fav-search').oninput = e => {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(() => renderSearch(e.target.value.trim()), 300);
  };

  // Saved favourites
  const divider = document.createElement('div');
  divider.style.cssText = 'border-top:1px solid var(--border);padding-top:14px';
  divider.innerHTML = `<div style="font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg2);margin-bottom:8px">${esc(t('gh_saved_favourites'))}</div>`;
  sc.appendChild(divider);

  const favsEl = document.createElement('div');
  favsEl.style.cssText = 'display:flex;flex-direction:column;gap:6px';
  divider.appendChild(favsEl);

  function renderSavedFavs() {
    favsEl.innerHTML = '';
    if (!_favs || !_favs.length) {
      favsEl.innerHTML = `<div style="color:var(--fg2);font-size:13px">${esc(t('gh_no_favourites_yet'))}</div>`;
      return;
    }
    _favs.forEach(f => favsEl.appendChild(_playerRow(f, renderSavedFavs)));
  }
  renderSavedFavs();
}

function _playerRow(p, onFavChange) {
  const fav = _isFav(p.id);
  const row = document.createElement('div');
  row.className = 'row';
  row.style.cssText += ';gap:12px;justify-content:space-between';
  row.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer" id="pr-name">
      ${GHAvatar.renderAvatar(p, 32)}
      <div style="min-width:0">
        <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.display_name||p.username||'?')}</div>
        ${p.username?`<div style="font-size:11px;color:var(--fg2)">@${esc(p.username)}</div>`:''}
      </div>
    </div>
    <button class="btn btn-secondary" id="pr-fav" style="padding:5px 10px;font-size:12px;flex-shrink:0">${fav?esc(t('gh_fav_saved')):esc(t('gh_fav_add'))}</button>`;
  row.querySelector('#pr-name').onclick = () => showOtherPlayerProfile(p);
  row.querySelector('#pr-fav').onclick = async e => {
    e.stopPropagation();
    await _toggleFav(p);
    if (onFavChange) onFavChange();
    else { const b = row.querySelector('#pr-fav'); b.textContent = _isFav(p.id)?t('gh_fav_saved'):t('gh_fav_add'); }
  };
  return row;
}

window._ghI18nReady.then(boot);
</script>
