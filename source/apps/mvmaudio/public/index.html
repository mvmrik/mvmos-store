<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>mvmAudio</title><link rel="stylesheet" href="/apps/mvmaudio/style.css"><style>html,body{margin:0;height:100%;background:#11161d}#mvmaudio-root{height:100dvh;min-height:0}</style></head><body><div id="mvmaudio-root"></div><script src="/i18n/i18n.js"></script><script>
(async()=>{
 if(!localStorage.getItem('apphub_token')){location.replace('/pub/apphub/?return='+encodeURIComponent(location.href));return;}
 const load=src=>new Promise((ok,bad)=>{const s=document.createElement('script');s.src=window.asset(src);s.onload=ok;s.onerror=bad;document.head.appendChild(s)});
 await (window.mvmOS?.i18nReady||Promise.resolve());
 await load('/apps/mvmaudio/i18n.js');await load('/apps/mvmaudio/player.js');
 window.MvmAudio.mount(document.getElementById('mvmaudio-root'),{onNeedLogin(){location.replace('/pub/apphub/?return='+encodeURIComponent(location.href))}});
})();
</script></body></html>
